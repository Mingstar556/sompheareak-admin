<!DOCTYPE html>
<html lang="km">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta name="description" content="Somphea Reak Studio – Admin Management Desk & Order Control Center" />
    <meta name="author" content="Somphea Reak Studio (សម្ភារៈ)" />
    <meta name="copyright" content="Copyright © 2026 Somphea Reak Studio. All Rights Reserved." />
    <meta name="publisher" content="Somphea Reak Studio" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#07090e" />
    <link rel="canonical" href="https://admin.sompheareak.com" />

    <!-- Open Graph / Telegram / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://admin.sompheareak.com" />
    <meta property="og:title" content="សម្ភារៈ - Somphea Reak Studio | Admin Desk" />
    <meta property="og:description" content="Somphea Reak Studio – Admin Management Desk & Order Control Center." />
    <meta property="og:image" content="/logo.jpg" />
    <meta property="og:site_name" content="Somphea Reak Studio Admin" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="សម្ភារៈ - Somphea Reak Studio" />
    <meta name="twitter:description" content="Cambodia Kingdom of Wonder • Premium Collectibles, Toys & Customizable Italy Charm Jewelry" />
    <meta name="twitter:image" content="/logo.jpg" />

    <!-- Native iOS & iPhone PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <!-- Style reset for React Native Web & Default Light luxury theme -->
    <style id="expo-reset">
      /* Invisible Scrollbars across all platforms & elements */
      html, body, #root, div, span, * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar,
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      #root::-webkit-scrollbar {
        width: 0px !important;
        height: 0px !important;
        display: none !important;
        background: transparent !important;
      }

      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", -apple-system-subheadline, "Segoe UI", Roboto, "Battambang", "Hanuman", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-overflow-scrolling: touch;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      /* Prevent iOS Safari input auto-zoom by enforcing 16px minimum */
      input, textarea, select {
        font-size: 16px !important;
        -webkit-appearance: none;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        flex: 1;
        background-color: #f8fafc;
        overflow: hidden;
      }
      /* Fast Splash Skeleton & Brand Loader */
      .sr-splash-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      .sr-splash-logo {
        width: 80px;
        height: 80px;
        border-radius: 40px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 0 40px rgba(212, 175, 55, 0.25);
        margin-bottom: 20px;
        animation: sr-pulse 2s infinite ease-in-out;
      }
      .sr-splash-title {
        font-size: 18px;
        font-weight: 800;
        color: #0f172a;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .sr-splash-subtitle {
        font-size: 11px;
        font-weight: 700;
        color: #10b981;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 22px;
      }
      .sr-splash-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(212, 175, 55, 0.2);
        border-top-color: #d4af37;
        border-right-color: #10b981;
        border-radius: 50%;
        animation: sr-spin 0.8s linear infinite;
      }
      @keyframes sr-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes sr-pulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      /* ================================================================ */
      /* Professional Micro-Interactions, Shadows & Depth Effects        */
      /* ================================================================ */
      button,
      [role="button"],
      a,
      .interactive-hover,
      .charm-slot-interactive,
      .charm-picker-card {
        cursor: pointer !important;
        user-select: none;
        -webkit-user-select: none;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 0.22s ease,
                    filter 0.22s ease !important;
      }

      button:hover,
      [role="button"]:hover,
      .interactive-hover:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
      }

      button:active,
      [role="button"]:active,
      .interactive-hover:active {
        transform: scale(0.97);
      }

      /* Smooth Card Hover with Layered Ambient Depth & Subtle Shimmer */
      .sr-card {
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 0.25s ease !important;
      }
      .sr-card:hover {
        transform: translateY(-4px) !important;
        box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.25) !important;
      }

      /* Telegram Floating Support Glow */
      @keyframes tlg-pulse {
        0%, 100% {
          box-shadow: 0 6px 20px rgba(34, 158, 217, 0.35), 0 0 0 0 rgba(34, 158, 217, 0.4);
        }
        50% {
          box-shadow: 0 8px 24px rgba(34, 158, 217, 0.5), 0 0 0 6px rgba(34, 158, 217, 0.1);
        }
      }
      .floating-tlg-glow {
        animation: tlg-pulse 3s infinite ease-in-out;
      }

      .charm-slot-interactive:hover {
        transform: translateY(-4px) scale(1.08) !important;
        box-shadow: 0 0 18px rgba(212, 175, 55, 0.55), 0 4px 14px rgba(0,0,0,0.45) !important;
        z-index: 10 !important;
      }

      .charm-picker-card:hover {
        transform: translateY(-4px) scale(1.06) !important;
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.35), 0 0 12px rgba(212, 175, 55, 0.3) !important;
        border-color: #d4af37 !important;
        z-index: 5 !important;
      }
    </style>
    <link rel="shortcut icon" href="/favicon.ico" />
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; color: white;">
        You need to enable JavaScript to run Somphea Reak Studio.
      </div>
    </noscript>
    <div id="root"></div>

    <!-- Branded zero-latency splash screen shown until React mounts -->
    <div class="sr-splash-loader" id="sr-splash">
      <img class="sr-splash-logo" src="/logo.jpg" onerror="this.src='/favicon.ico'; this.style.borderRadius='8px';" alt="Somphea Reak Logo" />
      <div class="sr-splash-title">សម្ភារៈ • Somphea Reak Studio</div>
      <div class="sr-splash-subtitle">Premium Collectibles & Italy Charms</div>
      <div class="sr-splash-spinner"></div>
    </div>

    <script>
      (function() {
        try {
          var t = localStorage.getItem('sr_mobile_theme_v2');
          if (t === 'dark') {
            document.documentElement.style.backgroundColor = '#0c0e17';
            document.body.style.backgroundColor = '#0c0e17';
            var rootEl = document.getElementById('root');
            if (rootEl) rootEl.style.backgroundColor = '#0c0e17';
            var sp = document.getElementById('sr-splash');
            if (sp) {
              sp.style.backgroundColor = '#0c0e17';
              var title = sp.querySelector('.sr-splash-title');
              if (title) title.style.color = '#f8fafc';
            }
          }
        } catch(e) {}
      })();

      // Called explicitly by App.js on first mount to dismiss splash smoothly
      window.__dismissSplash = function() {
        var sp = document.getElementById('sr-splash');
        if (sp) {
          sp.style.opacity = '0';
          setTimeout(function() {
            if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
          }, 320);
        }
      };

      // Safety timeout: If React takes longer than 4s, dismiss splash gracefully
      window.addEventListener('load', function() {
        setTimeout(function() {
          if (typeof window.__dismissSplash === 'function') {
            window.__dismissSplash();
          }
        }, 4000);
      });

      // Global crash catcher to prevent silent white screen
      window.addEventListener('error', function(e) {
        console.error('Global application error:', e);
        var sp = document.getElementById('sr-splash');
        if (sp) {
          var title = sp.querySelector('.sr-splash-title');
          var subtitle = sp.querySelector('.sr-splash-subtitle');
          var spinner = sp.querySelector('.sr-splash-spinner');
          if (title) title.innerText = 'Application Loading Notice';
          if (subtitle) {
            subtitle.innerHTML = '<span style="color:#ef4444;font-size:12px;font-weight:700;">' +
              (e.message || 'An error occurred while loading the app') +
              '</span><br><br><button onclick="try{localStorage.clear();}catch(x){};window.location.reload();" style="padding:10px 18px;border-radius:10px;background:#10b981;color:#fff;border:none;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(16,185,129,0.4);">🔄 Clear Cache & Reload</button>';
          }
          if (spinner) spinner.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
